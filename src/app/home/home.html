<div class="home-container">
  <!-- Header -->
  <header class="header">
    <div class="location-section">
      <h1 class="brand-name">Krishiva</h1>
      <div class="location">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
        <span>Hyderabad, India</span>
      </div>
    </div>
    <div class="header-actions">
      <button class="icon-btn"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg></button>
      <button class="icon-btn"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg></button>
    </div>
  </header>

  <!-- Search -->
  <div class="search-bar">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#999" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
    <input type="text" placeholder="Search for products, farmers..." />
  </div>

  <!-- Banner -->
  <div class="promo-banner">
    <div class="promo-content">
      <h2>Go Organic, Live Healthy</h2>
      <p>Choose organic, choose life.</p>
      <button class="btn-primary" routerLink="/market">Shop Now</button>
    </div>
    <div class="promo-image">
      <img src="/buyer.jpg" alt="Organic Basket" />
    </div>
  </div>

  <!-- Categories -->
  <section class="section">
    <div class="section-header">
      <h3>Categories</h3>
      <a href="#" class="view-all">View All</a>
    </div>
    <div class="categories-list">
      <div class="category-item" *ngFor="let cat of categories">
        <div class="category-icon">{{cat.icon}}</div>
        <span class="category-name">{{cat.name}}</span>
      </div>
    </div>
  </section>

  <!-- Featured Products -->
  <section class="section">
    <div class="section-header">
      <h3>Featured Products</h3>
      <a routerLink="/market" class="view-all">View All</a>
    </div>
    <div class="products-grid">
      <div class="product-card" *ngFor="let prod of featuredProducts" routerLink="/product/{{prod.id}}">
        <div class="product-image">{{prod.image}}</div>
        <div class="product-info">
          <h4 class="product-name">{{prod.name}}</h4>
          <span class="product-price">{{prod.price}}</span>
        </div>
      </div>
    </div>
  </section>
</div>
