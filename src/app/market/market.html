<div class="market-container">
  <header class="header">
    <button class="icon-btn" routerLink="/home"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></button>
    <h2>Vegetables</h2>
    <div class="header-actions">
      <button class="icon-btn"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg></button>
    </div>
  </header>

  <div class="filters">
    <button *ngFor="let f of filters" 
            class="filter-chip" 
            [class.active]="f === activeFilter"
            (click)="setFilter(f)">
      {{f}}
    </button>
    <button class="icon-btn filter-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon></svg></button>
  </div>

  <div class="product-list">
    <div class="product-item" *ngFor="let prod of products" routerLink="/product/{{prod.id}}">
      <div class="product-img-wrapper">{{prod.image}}</div>
      <div class="product-info">
        <h4>{{prod.name}}</h4>
        <p class="type">{{prod.type}}</p>
        <div class="price-row">
          <span class="price">{{prod.price}}</span>
          <span class="rating">★ {{prod.rating}}</span>
          <button class="add-btn" (click)="addToCart(prod, $event)">+</button>
        </div>
      </div>
    </div>
  </div>
</div>
