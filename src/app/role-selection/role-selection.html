<div class="role-container">
  <div class="header">
    <button class="back-btn" aria-label="Go back">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M15 18L9 12L15 6" stroke="#1A1A1A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>
  
  <div class="title-section">
    <h1 class="main-title">Choose Your Role</h1>
    <p class="sub-title">Select how you want to continue</p>
  </div>

  <div class="roles-wrapper">
    <div class="role-card" (click)="selectRole('farmer')">
      <div class="role-icon-wrapper farmer-bg">
        <img src="/farmer.jpg" alt="Farmer" class="role-image" />
      </div>
      <div class="role-details">
        <h2 class="role-title">I am a Farmer</h2>
        <p class="role-desc">Sell your organic products directly to buyers</p>
      </div>
    </div>

    <div class="role-card" (click)="selectRole('buyer')">
      <div class="role-icon-wrapper buyer-bg">
        <img src="/buyer.jpg" alt="Buyer" class="role-image" />
      </div>
      <div class="role-details">
        <h2 class="role-title">I am a Buyer</h2>
        <p class="role-desc">Buy organic products from trusted farmers</p>
      </div>
    </div>
  </div>
</div>
